<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a0d14">
    <title>Customer Reviews | PATHUM ISI ACC STORE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⭐</text></svg>">
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        * {
            scrollbar-width: none !important;
            -ms-overflow-style: none !important
        }

        *::-webkit-scrollbar {
            display: none !important
        }

        html,
        body {
            overflow-x: hidden;
            max-width: 100vw
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right)
        }

        .font-display {
            font-family: 'Orbitron', sans-serif;
            letter-spacing: .05em
        }

        .bg-scene {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: -1;
            background: #0a0d14
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(110px);
            opacity: .4;
            z-index: 1
        }

        .orb-a {
            width: min(70vmin, 560px);
            height: min(70vmin, 560px);
            background: radial-gradient(circle, #f59e0b, transparent 65%);
            top: -15%;
            left: -15%;
            animation: orbA 9s ease-in-out infinite
        }

        .orb-b {
            width: min(65vmin, 500px);
            height: min(65vmin, 500px);
            background: radial-gradient(circle, #a855f7, transparent 65%);
            bottom: -18%;
            right: -12%;
            animation: orbB 11s ease-in-out infinite;
            animation-delay: -3s
        }

        .orb-c {
            width: min(55vmin, 420px);
            height: min(55vmin, 420px);
            background: radial-gradient(circle, #06b6d4, transparent 65%);
            top: 40%;
            left: 65%;
            animation: orbC 13s ease-in-out infinite;
            animation-delay: -5s
        }

        .orb-d {
            width: min(45vmin, 340px);
            height: min(45vmin, 340px);
            background: radial-gradient(circle, #ef4444, transparent 65%);
            bottom: 16%;
            left: 6%;
            animation: orbD 10s ease-in-out infinite;
            animation-delay: -2s
        }

        @keyframes orbA {

            0%,
            100% {
                transform: translate(0, 0) scale(1)
            }

            50% {
                transform: translate(90px, 70px) scale(1.2)
            }
        }

        @keyframes orbB {

            0%,
            100% {
                transform: translate(0, 0) scale(1)
            }

            50% {
                transform: translate(-80px, -60px) scale(1.15)
            }
        }

        @keyframes orbC {

            0%,
            100% {
                transform: translate(0, 0) scale(1)
            }

            50% {
                transform: translate(-100px, 50px) scale(.88)
            }
        }

        @keyframes orbD {

            0%,
            100% {
                transform: translate(0, 0) scale(1)
            }

            50% {
                transform: translate(60px, -80px) scale(1.22)
            }
        }

        .grid-floor {
            position: absolute;
            inset: 0;
            background-image: linear-gradient(rgba(245, 158, 11, .06) 1px, transparent 1px), linear-gradient(90deg, rgba(245, 158, 11, .06) 1px, transparent 1px);
            background-size: clamp(36px, 5vmin, 60px) clamp(36px, 5vmin, 60px);
            -webkit-mask-image: radial-gradient(circle at center, black 10%, transparent 72%);
            mask-image: radial-gradient(circle at center, black 10%, transparent 72%);
            animation: gridScroll 22s linear infinite;
            z-index: 1;
            opacity: .7
        }

        @keyframes gridScroll {
            from {
                background-position: 0 0
            }

            to {
                background-position: 60px 60px
            }
        }

        .glass {
            background: linear-gradient(160deg, rgba(18, 22, 34, .9) 0%, rgba(12, 16, 26, .9) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, .06);
            transition: all .3s
        }

        .review-card {
            position: relative;
            overflow: hidden
        }

        .review-card::before {
            content: "";
            position: absolute;
            inset: -1px;
            border-radius: 16px;
            padding: 1px;
            background: linear-gradient(135deg, rgba(245, 158, 11, .5), transparent 40%, transparent 60%, rgba(168, 85, 247, .5));
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity .4s;
            pointer-events: none
        }

        .review-card:hover::before {
            opacity: 1
        }

        .review-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px -12px rgba(245, 158, 11, .25)
        }

        .stars {
            color: #f59e0b;
            text-shadow: 0 0 10px rgba(245, 158, 11, .4);
            letter-spacing: 1px
        }
    </style>
</head>

<body class="bg-[#0a0d14] text-gray-100 min-h-screen selection:bg-amber-500 selection:text-black">

    <div class="bg-scene">
        <div class="orb orb-a"></div>
        <div class="orb orb-b"></div>
        <div class="orb orb-c"></div>
        <div class="orb orb-d"></div>
        <div class="grid-floor"></div>
    </div>

    <nav
        class="sticky top-0 z-40 bg-[#0d111a]/90 backdrop-blur-xl border-b border-gray-800/60 px-4 lg:px-10 py-3.5 flex items-center justify-between">
        <a href="index.html"
            class="text-xs font-bold text-gray-400 hover:text-amber-400 flex items-center gap-2 transition">
            <span class="text-amber-500">←</span> Back to Storefront
        </a>
        <span class="font-display text-sm font-black text-amber-500 tracking-wider">PATHUM ISI ACC STORE</span>
    </nav>

    <header class="max-w-4xl mx-auto px-4 pt-10 sm:pt-14 pb-6 text-center">
        <span
            class="text-[10px] tracking-widest uppercase font-bold text-amber-500 bg-amber-500/10 border border-amber-500/20 px-3 py-1 rounded-full inline-block">★
            Verified Feedback</span>
        <h1 class="font-display text-2xl sm:text-4xl font-black text-white mt-4 tracking-wider">
            CUSTOMER <span
                class="bg-gradient-to-r from-amber-400 via-orange-500 to-red-500 bg-clip-text text-transparent drop-shadow-[0_0_25px_rgba(245,158,11,0.5)]">REVIEWS</span>
        </h1>
        <p class="text-gray-400 text-xs sm:text-sm mt-3 max-w-xl mx-auto">Real feedback from verified buyers who
            purchased accounts from our store.</p>
    </header>

    <main class="max-w-6xl mx-auto px-4 lg:px-8 py-6 sm:py-8">
        <div id="reviewsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-5">
            <div class="col-span-full text-center py-20 text-xs text-gray-500 font-mono">
                <div
                    class="inline-block w-8 h-8 border-2 border-amber-500/30 border-t-amber-500 rounded-full animate-spin mb-3">
                </div>
                <p>Loading reviews...</p>
            </div>
        </div>
    </main>

    <footer class="border-t border-gray-800/60 mt-8 py-6 text-center">
        <p class="text-[10px] text-gray-600 font-mono">© 2024 PATHUM ISI ACC STORE — Premium Free Fire Marketplace</p>
    </footer>

    <script>
        const BACKEND_URL = "https://pathum-isi-production.up.railway.app/api";

        async function loadReviews() {
            try {
                const res = await fetch(BACKEND_URL + '/reviews');
                const data = await res.json();
                const container = document.getElementById('reviewsGrid');
                if (!data.success || !data.reviews || data.reviews.length === 0) {
                    container.innerHTML = '<div class="col-span-full text-center py-20 text-xs text-gray-500 font-mono">No reviews yet. Check back soon!</div>';
                    return;
                }
                container.innerHTML = '';
                data.reviews.forEach(r => {
                    const div = document.createElement('div');
                    div.className = 'glass review-card rounded-2xl p-5';
                    const stars = '★'.repeat(r.rating) + '☆'.repeat(5 - r.rating);
                    const initial = (r.reviewerName || 'U')[0].toUpperCase();
                    div.innerHTML = `
            <div class="flex items-start gap-3 mb-3">
              ${r.imageUrl
                            ? `<img src="${r.imageUrl}" class="w-12 h-12 rounded-full object-cover border-2 border-amber-500/50 flex-shrink-0 shadow-lg shadow-amber-500/20">`
                            : `<div class="w-12 h-12 rounded-full bg-gradient-to-br from-amber-500 to-orange-600 flex items-center justify-center text-black font-black text-base flex-shrink-0 shadow-lg shadow-amber-500/20">${initial}</div>`}
              <div class="min-w-0 flex-1 pt-0.5">
                <p class="text-sm font-bold text-white truncate">${r.reviewerName}</p>
                <p class="stars text-sm mt-0.5">${stars}</p>
              </div>
            </div>
            <p class="text-xs text-gray-300 leading-relaxed">${r.reviewText}</p>
            ${r.createdAt ? `<p class="text-[10px] text-gray-500 font-mono mt-3">${new Date(r.createdAt).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' })}</p>` : ''}`;
                    container.appendChild(div);
                });
            } catch (err) {
                document.getElementById('reviewsGrid').innerHTML = '<div class="col-span-full text-center py-20 text-xs text-red-400">Failed to load reviews.</div>';
            }
        }

        window.addEventListener('DOMContentLoaded', loadReviews);
    </script>
</body>

</html>
