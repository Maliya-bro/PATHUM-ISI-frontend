<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a0d14">
    <title>Account Overview | PATHUM ISI ACC STORE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        * {
            scrollbar-width: none !important;
            -ms-overflow-style: none !important
        }

        *::-webkit-scrollbar {
            display: none !important
        }

        html,
        body {
            overflow-x: hidden;
            max-width: 100vw
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right)
        }

        .font-display {
            font-family: 'Orbitron', sans-serif;
            letter-spacing: .05em
        }

        /* PERSISTENT BG */
        .bg-scene {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: -1;
            background: #0a0d14
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(110px);
            opacity: .4;
            z-index: 1
        }

        .orb-a {
            width: min(70vmin, 560px);
            height: min(70vmin, 560px);
            background: radial-gradient(circle, #f59e0b, transparent 65%);
            top: -15%;
            left: -15%;
            animation: orbA 9s ease-in-out infinite
        }

        .orb-b {
            width: min(65vmin, 500px);
            height: min(65vmin, 500px);
            background: radial-gradient(circle, #a855f7, transparent 65%);
            bottom: -18%;
            right: -12%;
            animation: orbB 11s ease-in-out infinite;
            animation-delay: -3s
        }

        .orb-c {
            width: min(55vmin, 420px);
            height: min(55vmin, 420px);
            background: radial-gradient(circle, #06b6d4, transparent 65%);
            top: 40%;
            left: 65%;
            animation: orbC 13s ease-in-out infinite;
            animation-delay: -5s
        }

        .orb-d {
            width: min(45vmin, 340px);
            height: min(45vmin, 340px);
            background: radial-gradient(circle, #ef4444, transparent 65%);
            bottom: 16%;
            left: 6%;
            animation: orbD 10s ease-in-out infinite;
            animation-delay: -2s
        }

        @keyframes orbA {

            0%,
            100% {
                transform: translate(0, 0) scale(1)
            }

            50% {
                transform: translate(90px, 70px) scale(1.2)
            }
        }

        @keyframes orbB {

            0%,
            100% {
                transform: translate(0, 0) scale(1)
            }

            50% {
                transform: translate(-80px, -60px) scale(1.15)
            }
        }

        @keyframes orbC {

            0%,
            100% {
                transform: translate(0, 0) scale(1)
            }

            50% {
                transform: translate(-100px, 50px) scale(.88)
            }
        }

        @keyframes orbD {

            0%,
            100% {
                transform: translate(0, 0) scale(1)
            }

            50% {
                transform: translate(60px, -80px) scale(1.22)
            }
        }

        .grid-floor {
            position: absolute;
            inset: 0;
            background-image: linear-gradient(rgba(245, 158, 11, .06) 1px, transparent 1px), linear-gradient(90deg, rgba(245, 158, 11, .06) 1px, transparent 1px);
            background-size: clamp(36px, 5vmin, 60px) clamp(36px, 5vmin, 60px);
            -webkit-mask-image: radial-gradient(circle at center, black 10%, transparent 72%);
            mask-image: radial-gradient(circle at center, black 10%, transparent 72%);
            animation: gridScroll 22s linear infinite;
            z-index: 1;
            opacity: .7
        }

        @keyframes gridScroll {
            from {
                background-position: 0 0
            }

            to {
                background-position: 60px 60px
            }
        }

        .glass {
            background: linear-gradient(160deg, rgba(18, 22, 34, .9) 0%, rgba(12, 16, 26, .9) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, .06)
        }

        .image-frame {
            position: relative;
            background: #000;
            border: 1px solid rgba(245, 158, 11, .2);
            box-shadow: 0 0 60px rgba(245, 158, 11, .15), inset 0 0 40px rgba(0, 0, 0, .5)
        }

        .image-frame::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 2;
            background: repeating-linear-gradient(to bottom, rgba(245, 158, 11, .03) 0px, rgba(245, 158, 11, .03) 1px, transparent 1px, transparent 3px)
        }

        .thumb {
            transition: all .25s;
            border: 2px solid rgba(255, 255, 255, .1)
        }

        .thumb:hover {
            border-color: rgba(245, 158, 11, .5);
            transform: translateY(-2px)
        }

        .thumb.active {
            border-color: #f59e0b;
            box-shadow: 0 0 20px rgba(245, 158, 11, .5)
        }

        .special-badge {
            background: linear-gradient(135deg, #a855f7, #ec4899);
            box-shadow: 0 0 24px rgba(168, 85, 247, .6), 0 0 50px rgba(236, 72, 153, .3);
            animation: badgePulse 2s ease-in-out infinite
        }

        @keyframes badgePulse {

            0%,
            100% {
                box-shadow: 0 0 24px rgba(168, 85, 247, .6), 0 0 50px rgba(236, 72, 153, .3)
            }

            50% {
                box-shadow: 0 0 36px rgba(168, 85, 247, .9), 0 0 70px rgba(236, 72, 153, .5)
            }
        }

        .price-glow {
            text-shadow: 0 0 30px rgba(245, 158, 11, .5), 0 0 60px rgba(245, 158, 11, .2)
        }

        .btn-buy {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            box-shadow: 0 12px 30px -8px rgba(34, 197, 94, .5), 0 0 40px rgba(34, 197, 94, .15);
            position: relative;
            overflow: hidden;
            transition: all .3s
        }

        .btn-buy::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(120deg, transparent, rgba(255, 255, 255, .3), transparent);
            transform: translateX(-100%);
            transition: transform .6s
        }

        .btn-buy:hover::before {
            transform: translateX(100%)
        }

        .btn-buy:hover {
            box-shadow: 0 16px 40px -8px rgba(34, 197, 94, .8), 0 0 60px rgba(34, 197, 94, .3);
            transform: translateY(-2px)
        }

        .btn-buy:active {
            transform: translateY(0)
        }

        .input-field {
            background: #0a0d14;
            border: 1px solid rgba(255, 255, 255, .08);
            transition: all .2s
        }

        .input-field:focus {
            border-color: #f59e0b;
            box-shadow: 0 0 0 3px rgba(245, 158, 11, .15), 0 0 20px rgba(245, 158, 11, .1);
            outline: none
        }

        .qa-card {
            background: linear-gradient(135deg, #0a0d14, #0e121c);
            border: 1px solid rgba(255, 255, 255, .06);
            transition: all .25s
        }

        .qa-card:hover {
            border-color: rgba(245, 158, 11, .25)
        }

        .tag-pill {
            background: rgba(245, 158, 11, .1);
            border: 1px solid rgba(245, 158, 11, .3);
            color: #fcd34d;
            font-size: 10px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 9999px;
            display: inline-block
        }
    </style>
</head>

<body class="bg-[#0a0d14] text-gray-100 min-h-screen selection:bg-amber-500 selection:text-black">

    <!-- PERSISTENT BG -->
    <div class="bg-scene">
        <div class="orb orb-a"></div>
        <div class="orb orb-b"></div>
        <div class="orb orb-c"></div>
        <div class="orb orb-d"></div>
        <div class="grid-floor"></div>
    </div>

    <!-- NAV -->
    <nav
        class="sticky top-0 z-40 bg-[#0d111a]/90 backdrop-blur-xl border-b border-gray-800/60 px-4 lg:px-10 py-3.5 flex items-center justify-between">
        <a href="index.html"
            class="text-xs font-bold text-gray-400 hover:text-amber-400 flex items-center gap-2 transition">
            <span class="text-amber-500">←</span> Back to Storefront
        </a>
        <span class="font-display text-sm font-black text-amber-500 tracking-wider">PATHUM ISI ACC STORE</span>
    </nav>

    <main class="max-w-6xl mx-auto px-4 py-6 sm:py-8">
        <div id="loaderState" class="text-center py-20 text-xs text-gray-500 font-mono">
            <div
                class="inline-block w-8 h-8 border-2 border-amber-500/30 border-t-amber-500 rounded-full animate-spin mb-3">
            </div>
            <p>Loading Account Details...</p>
        </div>

        <div id="contentSection" class="hidden">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 md:gap-8 items-start">
                <!-- Gallery -->
                <div class="md:sticky md:top-24">
                    <div
                        class="image-frame w-full h-72 sm:h-80 md:h-96 rounded-2xl overflow-hidden flex items-center justify-center">
                        <img id="mainDisplayImg" src="" alt="Main Preview"
                            class="w-full h-full object-contain relative z-10">
                    </div>
                    <div id="thumbList" class="flex space-x-2.5 mt-3 overflow-x-auto py-1"></div>
                </div>

                <!-- Info -->
                <div class="flex flex-col h-full justify-between">
                    <div>
                        <div id="specialBadge" class="hidden mb-3">
                            <span
                                class="special-badge inline-block text-white text-[10px] font-black px-3 py-1.5 rounded-full uppercase tracking-wider">★
                                Special Owner Account</span>
                        </div>
                        <h1 id="accTitle"
                            class="font-display text-xl sm:text-2xl font-black text-white leading-snug tracking-tight">
                        </h1>
                        <p id="accOwnerInfo" class="text-xs text-purple-400 font-mono mt-2 hidden"></p>
                        <div id="accTags" class="flex flex-wrap gap-1.5 mt-3"></div>

                        <div class="mt-5 p-4 rounded-xl glass">
                            <span class="text-[10px] text-amber-500 uppercase tracking-widest font-bold block mb-2">▸
                                Details & Inventory</span>
                            <p id="accDesc" class="text-xs text-gray-300 leading-relaxed whitespace-pre-line"></p>
                        </div>
                    </div>

                    <div class="mt-6 p-5 glass rounded-2xl relative overflow-hidden">
                        <div class="absolute -top-20 -right-20 w-40 h-40 bg-emerald-500/10 rounded-full blur-3xl"></div>
                        <div class="relative">
                            <div class="flex items-baseline space-x-3 mb-4">
                                <span id="accPrice"
                                    class="text-3xl sm:text-4xl font-black text-amber-400 price-glow font-display"></span>
                                <span id="accOldPrice" class="text-xs text-gray-500 line-through hidden"></span>
                            </div>
                            <button onclick="handlePurchase()"
                                class="btn-buy w-full text-black font-extrabold py-4 rounded-xl text-sm tracking-wider uppercase flex items-center justify-center gap-2">
                                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                                    <path
                                        d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z" />
                                </svg>
                                Buy Now via WhatsApp
                            </button>
                            <p
                                class="text-[10px] text-gray-500 text-center mt-2.5 flex items-center justify-center gap-1.5">
                                <span class="w-1 h-1 rounded-full bg-emerald-400"></span>
                                Guaranteed safety with verified store middleman escrow
                            </p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Q&A -->
            <section class="mt-10 sm:mt-12 glass rounded-2xl p-5 sm:p-6">
                <div class="flex items-center gap-2 mb-2">
                    <div class="w-1 h-6 rounded-full bg-gradient-to-b from-amber-400 to-orange-600"></div>
                    <h3 class="font-display text-sm font-bold text-white tracking-wider">CUSTOMER Q&A</h3>
                </div>
                <p class="text-xs text-gray-400 mb-6">Have questions about binding, levels or skins? Ask directly below.
                </p>

                <form id="qaForm" onsubmit="postQuestion(event)" class="mb-6">
                    <textarea id="questionInput" rows="2" placeholder="Sign in with Google to post questions..."
                        class="input-field w-full rounded-xl p-3.5 text-white text-xs focus:outline-none"></textarea>
                    <div class="mt-3 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                        <span id="authNotice" class="text-[11px] text-gray-500 order-2 sm:order-1"></span>
                        <button type="submit" id="btnSubmitQ"
                            class="bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-400 hover:to-orange-400 text-black text-xs font-bold px-5 py-2.5 rounded-lg transition shadow-lg shadow-amber-500/20 disabled:opacity-40 disabled:cursor-not-allowed order-1 sm:order-2">
                            Send Question
                        </button>
                    </div>
                </form>

                <div id="questionsContainer" class="space-y-3">
                    <p class="text-xs text-gray-500 text-center py-6">Loading inquiries...</p>
                </div>
            </section>
        </div>
    </main>

    <script>
        const BACKEND_URL = "https://your-backend.up.railway.app/api";
        const WHATSAPP_NUMBER = "94702135392";
        const urlParams = new URLSearchParams(window.location.search);
        const accountId = urlParams.get('id');
        let currentAccount = null;

        async function loadAccountData() {
            if (!accountId) {
                document.getElementById('loaderState').innerText = "Account ID missing in URL parameter.";
                return;
            }
            try {
                const res = await fetch(BACKEND_URL + '/accounts/' + accountId);
                const data = await res.json();
                if (!data.success || !data.account) {
                    document.getElementById('loaderState').innerText = "Account not found or has been sold.";
                    return;
                }
                currentAccount = data.account;
                renderAccount();
                loadQuestions();
            } catch (err) {
                document.getElementById('loaderState').innerText = "Failed to load account from backend.";
            }
        }

        function renderAccount() {
            document.getElementById('loaderState').classList.add('hidden');
            document.getElementById('contentSection').classList.remove('hidden');

            document.getElementById('accTitle').innerText = currentAccount.title;
            document.getElementById('accDesc').innerText = currentAccount.description;

            if (currentAccount.isSpecialOwner) {
                document.getElementById('specialBadge').classList.remove('hidden');
                if (currentAccount.specialOwnerDetails) {
                    const oi = document.getElementById('accOwnerInfo');
                    oi.innerText = '✓ Verified Contact: ' + currentAccount.specialOwnerDetails;
                    oi.classList.remove('hidden');
                }
            }

            const tagsBox = document.getElementById('accTags');
            if (currentAccount.tags && currentAccount.tags.length) {
                tagsBox.innerHTML = currentAccount.tags.map(t => `<span class="tag-pill">#${t}</span>`).join('');
            }

            if (currentAccount.discountPrice > 0) {
                document.getElementById('accPrice').innerText = 'Rs. ' + currentAccount.discountPrice.toLocaleString();
                const o = document.getElementById('accOldPrice');
                o.innerText = 'Rs. ' + currentAccount.price.toLocaleString();
                o.classList.remove('hidden');
            } else {
                document.getElementById('accPrice').innerText = 'Rs. ' + currentAccount.price.toLocaleString();
            }

            const images = currentAccount.images || [];
            const mainImg = document.getElementById('mainDisplayImg');
            const thumbList = document.getElementById('thumbList');
            thumbList.innerHTML = '';
            if (images.length > 0) {
                mainImg.src = images[0].url;
                images.forEach((img, idx) => {
                    const btn = document.createElement('button');
                    btn.className = 'thumb w-16 h-16 rounded-lg overflow-hidden flex-shrink-0 ' + (idx === 0 ? 'active' : '');
                    btn.innerHTML = `<img src="${img.url}" class="w-full h-full object-cover">`;
                    btn.onclick = () => {
                        mainImg.src = img.url;
                        Array.from(thumbList.children).forEach(c => c.classList.remove('active'));
                        btn.classList.add('active');
                    };
                    thumbList.appendChild(btn);
                });
            }

            const token = localStorage.getItem('google_id_token');
            const qInput = document.getElementById('questionInput');
            const qNotice = document.getElementById('authNotice');
            if (!token) {
                qInput.disabled = true;
                qInput.placeholder = 'Google login required to ask questions...';
                qNotice.innerHTML = '<span class="text-amber-400">⚠</span> Please <a href="index.html" class="text-amber-400 underline font-bold">login with Google</a> to ask questions.';
                document.getElementById('btnSubmitQ').disabled = true;
            } else {
                qInput.placeholder = "Write your question here...";
                qNotice.innerText = "✓ Logged in via Google";
                qNotice.className = "text-[11px] text-green-400 font-semibold";
            }
        }

        async function loadQuestions() {
            try {
                const res = await fetch(BACKEND_URL + '/questions/account/' + accountId);
                const data = await res.json();
                const container = document.getElementById('questionsContainer');
                if (!data.success || !data.questions || data.questions.length === 0) {
                    container.innerHTML = '<p class="text-xs text-gray-500 text-center py-4">No questions yet. Be the first to ask!</p>';
                    return;
                }
                container.innerHTML = '';
                data.questions.forEach(q => {
                    const div = document.createElement('div');
                    div.className = 'qa-card p-4 rounded-xl text-xs';
                    div.innerHTML =
                        `<div class="flex items-center space-x-2 mb-2">
              <img src="${q.userAvatar || 'https://via.placeholder.com/20'}" class="w-6 h-6 rounded-full border border-amber-500/30">
              <span class="font-bold text-gray-200 text-[11px]">${q.userName}</span>
            </div>
            <p class="text-gray-200 ml-8 leading-relaxed">${q.question}</p>
            ${q.reply ? `<div class="ml-8 mt-2.5 p-3 bg-[#141926] border-l-2 border-amber-500 rounded-lg text-gray-300 text-[11px] leading-relaxed"><span class="text-[9px] text-amber-400 font-bold block mb-1 uppercase tracking-wider">✦ Admin Response</span>${q.reply}</div>` : ''}`;
                    container.appendChild(div);
                });
            } catch (err) { console.error(err); }
        }

        async function postQuestion(e) {
            e.preventDefault();
            const token = localStorage.getItem('google_id_token');
            const input = document.getElementById('questionInput');
            const qText = input.value.trim();
            if (!token) { alert('Please login with Google first!'); return; }
            if (!qText) return;
            try {
                const res = await fetch(BACKEND_URL + '/questions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify({ accountId: accountId, question: qText })
                });
                const data = await res.json();
                if (data.success) { input.value = ''; loadQuestions(); }
                else alert(data.message || 'Error sending question');
            } catch (err) { alert('Could not connect to backend.'); }
        }

        function handlePurchase() {
            const acc = currentAccount;
            const price = acc.discountPrice > 0 ? acc.discountPrice : acc.price;
            const link = window.location.origin + window.location.pathname + '?id=' + acc._id;
            const msg =
                `Hello PATHUM ISI Store! 👋\n\n` +
                `I'm interested in buying this Free Fire account:\n\n` +
                `📌 *${acc.title}*\n` +
                `💰 Price: Rs. ${price.toLocaleString()}\n` +
                `🆔 ID: ${acc._id}\n` +
                `🔗 ${link}\n\n` +
                `Please guide me through the purchase process.`;
            window.open('https://wa.me/' + WHATSAPP_NUMBER + '?text=' + encodeURIComponent(msg), '_blank');
        }

        window.addEventListener('DOMContentLoaded', loadAccountData);
    </script>
</body>

</html>
